<h1>Hello from my Django Website!</h1>
<p>I made this using Django 🎉</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit</button>
</form>
<h2>Comments:</h2>

{% for comment in comments %}
    <p><strong>{{ comment.name }}</strong>: {{ comment.comment }}</p>
{% endfor %}
